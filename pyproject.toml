[project]
# Distribution name only. The import package is still `tabicl` (see tool.hatch.build
# targets below), because all 46 modules under tabicl.scaling import it by that name and
# renaming the import would fork the codebase away from upstream for no benefit.
#
# Consequence worth knowing: `tabicl-rel` and upstream `tabicl` both own the `tabicl/`
# directory, so they cannot be installed into the same environment. That is intended --
# this is a replacement for upstream, not an addition to it.
name = "tabicl-rel"
dynamic = ["version"]
description = "TabICL + relational scaling work: a fork of soda-inria/tabicl with the tabicl.scaling research campaign"
readme = "README.md"
authors = [
    { name = "Jingang Qu" },
    { name = "David Holzmüller" } ,
    { name = "Marine Le Morvan" } ,
    { name = "Gaël Varoquaux" } ,
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["tabular data", "foundation model", "TabICL", "in-context learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    'Programming Language :: Python :: 3',
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "torch>=2.2",  # to enjoy Flash Attention v2
    "scikit-learn>=1.3.0",
    "numpy",
    "scipy",
    "einops>=0.7",  # this is only used for rope, so it could be replaced
    "psutil",  # used for memory calculation at inference
    "tqdm>=4.64.0",
    "huggingface-hub",
]

[project.optional-dependencies]
doc = [
  "sphinx",
  "sphinx-copybutton",
  "sphinx-gallery",
  "matplotlib>=3.10.3",
  "pydata-sphinx-theme",
  "sphinxext-opengraph",
  "skrub",
  "pandas",
  "shap>=0.42",
  "shapiq>=1.0",
  "numba",  # Add it here to facilitate the life of the installer
]
forecast = [                                                                                                                                                                                                        
    "pandas>=2.1.2",
    "statsmodels>=0.14.5",  # seasonal detection
    "matplotlib>=3.10.3",  # plotting
]
shap = [
    "shap>=0.42",
    "shapiq>=1.0",
    "matplotlib>=3.10.3",
    "numba",  # Add it here to facilitate the life of the installer
]
pretrain = [
    "transformers",  # only used in optim for schedules
    "xgboost",  # used in the TabICLv1 prior
    "wandb",  # logging in pre-training
]
finetune = [
    "transformers",  # get_scheduler reuses the pretraining cosine-warmup schedules
    "wandb",  # optional, only engaged when wandb_kwargs is passed
]
test = [
    "pandas",
    "pytest",
]
scaling = [
    # Everything `tabicl.scaling` imports that the core package does not already pull in.
    # Without this the modules install but do not import, which is how the work shipped
    # for 398 commits: present in the wheel, unusable on arrival.
    "pandas>=2.1.2",
    "relbench>=2.1",  # the benchmark the scaling campaign is measured on
    "tabpfn>=8.0",  # baseline compared against in eval_track_record
    "tabfm>=1.0",  # requires Python >= 3.11, unlike the rest of this package
    "lightgbm>=4.0",  # gradient-boosting baseline
    "featuretools>=1.31",  # DFS baseline in eval_dfs_baseline
    "runpod>=1.12",  # only used by the remote round driver in cycle.py
    # pybind11 is NOT here: it is a build-time requirement of the optional C++ join
    # accelerator, installed on demand by `python -m tabicl.scaling.build_native`.
]
all = [
    # Must name the distribution, not the import package: `tabicl[...]` here would resolve
    # to upstream's PyPI release and install a second copy of the `tabicl/` directory.
    "tabicl-rel[doc,forecast,shap,pretrain,finetune,test,scaling]",
]

[build-system]
requires = ["hatchling>=1.26.1"]  # https://github.com/pypa/hatch/issues/1818
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tabicl/__about__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src/tabicl", "figures", "LICENSE", "README.md"]
exclude = [
    # Locally-built artifacts of the optional C++ join accelerator. These are gitignored,
    # but hatchling builds from the working tree, so an in-place build would otherwise put
    # a platform-specific binary into an otherwise portable artifact.
    "src/tabicl/scaling/_wcoj_native*.pyd",
    "src/tabicl/scaling/_wcoj_native*.so",
    "src/tabicl/scaling/build/",
    "src/tabicl/scaling/_build_tmp/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tabicl"]
# `_wcoj_native.cpp` is deliberately NOT excluded: shipping the source is what lets a Linux
# user run `python -m tabicl.scaling.build_native` to get the compiled join, while the
# wheel itself stays py3-none-any and installs anywhere.
exclude = [
    "src/tabicl/scaling/_wcoj_native*.pyd",
    "src/tabicl/scaling/_wcoj_native*.so",
    "src/tabicl/scaling/build/",
    "src/tabicl/scaling/_build_tmp/",
]

[tool.hatch.envs.default]
installer = "uv"
features = []

[tool.hatch.envs.hatch-test]
default-args = ["tests"]
installer = "uv"
features = ["test"]

[tool.hatch.envs.types]
extra-dependencies = [
    "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:tabicl tests}"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
    "src/tabicl/__about__.py",
]

[tool.coverage.paths]
tabicl = ["src"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

